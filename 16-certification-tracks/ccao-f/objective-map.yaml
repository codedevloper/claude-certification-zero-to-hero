# tools/build_coverage.py, which generates coverage-matrix.md. Paths are repository-relative
# and must match docs/CONTENT-MAP.md exactly.
#
# The labs are Python-based. CCAO-F candidates do not need to code: each lab README explains
# the concept first, and the practical-exercises.md page gives an equivalent no-code exercise
# in the Claude apps for every domain.

