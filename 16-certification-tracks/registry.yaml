  - code: CCAR-F
    slug: ccar-f
    name: Claude Certified Architect – Foundations
    status: supported
    track_dir: 16-certification-tracks/ccar-f
    question_dir: 17-practice-questions/ccar-f
    guide_version: "1.0 (effective July 2026)"
    verified: "2026-10-24"
    audience: >-
      Solution architects who design and implement production applications with Claude, with hands-on
      experience of the Claude Agent SDK, Claude Code, MCP tool design and structured-output prompting.
    prerequisites: >-
      None mandatory. Recommended: 6+ months of practical experience building with the Claude API,
      Agent SDK, Claude Code and MCP.
    format:
      items: 60
      item_types: [multiple-choice, multiple-response]
      structure: 4 scenarios drawn at random from a published bank of 6
      minutes: 120
      passing: Scaled score 720 on a 100–1,000 scale
      fee_usd: 125
      validity_months: 12
      result: Pass/fail + scaled score + percent-correct by domain
    source:
      title: Claude Certified Architect – Foundations Exam Guide v1.0
      url: https://anthropic-partners.skilljar.com/page/partner-certifications
    # The six published exam scenarios (names and primary domains from the guide). Practice questions
    # carry a `scenario_set` so mock forms can mirror "4 of 6" without reusing any official question.
    scenarios:
      - {id: support-agent, name: Customer Support Resolution Agent, primary_domains: [1, 2, 5]}
      - {id: code-generation, name: Code Generation with Claude Code, primary_domains: [3, 5]}
      - {id: research-system, name: Multi-Agent Research System, primary_domains: [1, 2, 5]}
      - {id: developer-productivity, name: Developer Productivity with Claude, primary_domains: [2, 3, 1]}
      - {id: ci-integration, name: Claude Code for Continuous Integration, primary_domains: [3, 4]}
      - {id: data-extraction, name: Structured Data Extraction, primary_domains: [4, 5]}
    domains:
      - id: 1
        name: Agentic Architecture & Orchestration
        weight: 27
        objectives:
          - {id: CCAR-F-1.1, text: Design and build agentic loops for autonomous task execution}
          - {id: CCAR-F-1.2, text: Orchestrate multi-agent systems with coordinator and subagent patterns}
          - {id: CCAR-F-1.3, text: Configure subagent invocation, context passing and spawning}
          - {id: CCAR-F-1.4, text: Build multi-step workflows with enforcement and handoff patterns}
          - {id: CCAR-F-1.5, text: Use Agent SDK hooks to intercept tool calls and normalise data}
          - {id: CCAR-F-1.6, text: Choose task decomposition strategies for complex workflows}
          - {id: CCAR-F-1.7, text: Manage session state, resumption and forking}
      - id: 2
        name: Tool Design & MCP Integration
        weight: 18
        objectives:
          - {id: CCAR-F-2.1, text: Design tool interfaces with clear descriptions and boundaries}
          - {id: CCAR-F-2.2, text: Return structured error responses from MCP tools}
          - {id: CCAR-F-2.3, text: Distribute tools across agents and configure tool choice}
          - {id: CCAR-F-2.4, text: Integrate MCP servers into Claude Code and agent workflows}
          - {id: CCAR-F-2.5, text: Choose and use the built-in tools (Read, Write, Edit, Bash, Grep, Glob) well}
      - id: 3
        name: Claude Code Configuration & Workflows
        weight: 20
        objectives:
          - {id: CCAR-F-3.1, text: Organise CLAUDE.md files by hierarchy, scope and module}
          - {id: CCAR-F-3.2, text: Create and configure custom slash commands and skills}
          - {id: CCAR-F-3.3, text: Use path-specific rules to load conventions conditionally}
          - {id: CCAR-F-3.4, text: Decide between plan mode and direct execution}
          - {id: CCAR-F-3.5, text: Refine work iteratively for progressive improvement}
          - {id: CCAR-F-3.6, text: Integrate Claude Code into CI/CD pipelines}
      - id: 4
        name: Prompt Engineering & Structured Output
        weight: 20
        objectives:
          - {id: CCAR-F-4.1, text: Write prompts with explicit criteria to raise precision and cut false positives}
          - {id: CCAR-F-4.2, text: Use few-shot examples for consistent, high-quality output}
          - {id: CCAR-F-4.3, text: Enforce structured output with tool use and JSON schemas}
          - {id: CCAR-F-4.4, text: Build validation, retry and feedback loops for extraction quality}
          - {id: CCAR-F-4.5, text: Design efficient batch processing strategies}
          - {id: CCAR-F-4.6, text: Design multi-instance and multi-pass review architectures}
      - id: 5
        name: Context Management & Reliability
        weight: 15
        objectives:
          - {id: CCAR-F-5.1, text: Preserve critical information across long interactions}
          - {id: CCAR-F-5.2, text: Design escalation and ambiguity-resolution patterns}
          - {id: CCAR-F-5.3, text: Propagate errors sensibly across multi-agent systems}
          - {id: CCAR-F-5.4, text: Manage context when exploring large codebases}
          - {id: CCAR-F-5.5, text: Design human review workflows and calibrate confidence}
          - {id: CCAR-F-5.6, text: Keep provenance and handle uncertainty in multi-source synthesis}

