# Base configuration for the GitHub Pages site.
# Do not run `mkdocs` against this file directly: `python tools/build_site.py` stages the
# Markdown, generates the navigation and writes .site/mkdocs.yml, which inherits from this file.
site_name: Claude Certification Zero to Hero (Unofficial)
site_description: From your first prompt to production-ready AI architecture. An unofficial, original study resource for Anthropic Claude certifications.
copyright: >-
  Unofficial study resource — not affiliated with or endorsed by Anthropic.
  Code MIT · Content CC BY 4.0
use_directory_urls: false

theme:
  name: material
  language: en
  icon:
    logo: material/school-outline
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.tabs.link

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      # GitHub-compatible heading anchors, so the same links work on GitHub and on the site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: info
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
