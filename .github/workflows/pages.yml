name: Deploy site to GitHub Pages

# One-time setup in the repository: Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}   # each job declares only what it needs

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read      # configure-pages reads the Pages settings
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-docs.txt
      - run: pip install -r requirements-dev.txt -r requirements-docs.txt
      - name: Make sure the mock-exam bundle matches the question banks
        run: python tools/build_web_bundle.py --check
      - name: Build site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python tools/build_site.py --strict
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # publish the site
      id-token: write  # OIDC token required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5