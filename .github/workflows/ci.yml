name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Content validation and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Questions, flashcards, internal links, exam claims, secrets, coverage, forms, web bundle
        run: python tools/validate_all.py
      - name: Lab smoke tests (mock mode, no API key)
        run: python tools/run_lab_smoke.py
      - name: Repository tests
        run: python -m pytest tests -q
      - name: Site builds cleanly (strict mode, warnings fail)
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          pip install -r requirements-docs.txt
          python tools/build_site.py --strict
      - name: Project tests (mock mode)
        env:
          CLAUDE_LAB_MODE: mock
        run: |
          for p in 20-real-world-projects/*/; do
            if [ -d "$p/tests" ]; then
              echo "::group::$p"
              (cd "$p" && python -m pytest tests -q)
              echo "::endgroup::"
            fi
          done

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: "**/*.md"

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
